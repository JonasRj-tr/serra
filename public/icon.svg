<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f381e" />
      <stop offset="100%" stop-color="#061c0e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#f5b000" />
      <stop offset="100%" stop-color="#c68a00" />
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8" />
      <stop offset="100%" stop-color="#8d6e63" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Box -->
  <rect width="512" height="512" rx="104" fill="url(#bg-grad)" />
  
  <!-- Subtle Border in Gold -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.6" />

  <!-- Carpenter Emblem Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Roof / A-Frame Structure (Carpintaria) -->
    <path d="M 256 100 L 400 240 L 370 240 L 256 135 L 142 240 L 112 240 Z" fill="url(#gold-grad)" />
    
    <!-- Chimney / Ridge beam accent -->
    <rect x="246" y="80" width="20" height="30" fill="url(#gold-grad)" rx="4" />
    
    <!-- Crossed Carpenter Tools: Square & Hammer -->
    <!-- Carpenter Framing Square (Esquadro) -->
    <path d="M 180 200 L 180 340 L 330 340 L 330 305 L 215 305 L 215 200 Z" fill="url(#gold-grad)" opacity="0.95" />
    
    <!-- Carpenter Handsaw / Wood Planks -->
    <!-- Wood Planks Deck / Estrutura -->
    <rect x="160" y="360" width="192" height="18" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="140" y="386" width="232" height="18" rx="4" fill="url(#gold-grad)" />
    <rect x="175" y="412" width="162" height="18" rx="4" fill="#ffffff" opacity="0.9" />

    <!-- Center JP Monogram / Typography -->
    <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">JP</text>
  </g>

  <!-- Bottom Subtitle Banner -->
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="6">CARPINTARIA</text>
</svg>
