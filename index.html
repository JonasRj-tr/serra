<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JP Carpintaria - Orçamentos & Planta Baixa</title>
    <meta name="description" content="Aplicativo PWA para orçamentos de carpintaria, planta baixa interativa, cálculo de madeira e envio via WhatsApp." />
    
    <!-- PWA Primary Tags -->
    <meta name="theme-color" content="#0f381e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JP Carpintaria" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="JP Carpintaria - Orçamentos & Projetos" />
    <meta property="og:description" content="Cálculo automático de quantitativo de madeira, planta baixa e envio direto no WhatsApp." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f4f6f8] text-slate-900 antialiased selection:bg-[#f5b000]/30 selection:text-[#0f381e]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA Service Worker registrado com sucesso!', reg.scope))
            .catch(err => console.log('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
